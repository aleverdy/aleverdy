<meta name="theme-color" content="#1E1A20" media="(prefers-color-scheme: dark)">
<meta name="description" content="Lima ronde cari sapi gemes, untuk Piyaa.">

<title>Cari Sapi Gemesnya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#2F2A2E;
    --ink-soft:#6B5F66;
    --paper:#F3EFE6;
    --surface:#FFFFFF;
    --surface-2:#FAF6EE;
    --line:#E2D9C9;
    --accent:#C7476A;
    --accent-ink:#FFFFFF;
    --accent-soft:#F6DCE3;
    --pasture:#8FB679;
    --pasture-2:#7CA466;
    --pasture-deep:#4F6F41;
    --bell:#F4B942;
    --lift:0 8px 24px rgba(47,42,46,.10);
    --r-card:22px;
    --r-btn:999px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F2E9EC;
      --ink-soft:#B9A8AF;
      --paper:#1E1A20;
      --surface:#2A242C;
      --surface-2:#332B36;
      --line:#3E3542;
      --accent:#FF93A8;
      --accent-ink:#33141F;
      --accent-soft:#42232E;
      --pasture:#5D7C4C;
      --pasture-2:#4F6B41;
      --pasture-deep:#CFE3C2;
      --bell:#FFD07A;
      --lift:0 8px 24px rgba(0,0,0,.38);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F2E9EC;
    --ink-soft:#B9A8AF;
    --paper:#1E1A20;
    --surface:#2A242C;
    --surface-2:#332B36;
    --line:#3E3542;
    --accent:#FF93A8;
    --accent-ink:#33141F;
    --accent-soft:#42232E;
    --pasture:#5D7C4C;
    --pasture-2:#4F6B41;
    --pasture-deep:#CFE3C2;
    --bell:#FFD07A;
    --lift:0 8px 24px rgba(0,0,0,.38);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.step,.wanted-label,.final{font-family:"Baloo 2",Karla,system-ui,sans-serif}

  .app{
    max-width:460px;
    margin:0 auto;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .bar{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(21px,6.4vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
  .step{font-size:12px;color:var(--ink-soft);font-weight:600;white-space:nowrap;flex:0 0 auto}

  .pen{display:flex;gap:8px}
  .slot{
    flex:1;aspect-ratio:1;border-radius:14px;
    background:var(--surface-2);
    border:2px dashed var(--line);
    display:grid;place-items:center;padding:3px;
  }
  .slot.filled{border-style:solid;border-color:var(--pasture);background:var(--surface)}
  .slot svg{width:100%;height:auto;display:block}
  .slot.pop{animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

  .wanted{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-card);padding:12px 14px;
  }
  .wanted-cow{width:76px;flex:0 0 76px}
  .wanted-text{min-width:0;flex:1 1 auto}
  .wanted-cow svg{width:100%;height:auto;display:block}
  .wanted-label{
    margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink-soft);
    letter-spacing:.06em;text-transform:uppercase;
  }
  .traits{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .traits li{
    font-size:14px;font-weight:700;
    background:var(--accent-soft);color:var(--accent);
    border-radius:var(--r-btn);padding:4px 11px;
  }

  .field{
    position:relative;
    border-radius:var(--r-card);
    background:linear-gradient(180deg,var(--pasture),var(--pasture-2));
    padding:10px;
    min-height:190px;
    overflow:hidden;
  }
  .field::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(94deg,rgba(255,255,255,.06) 0 3px,transparent 3px 13px);
  }
  .grid{display:grid;gap:5px;grid-template-columns:repeat(var(--cols,3),1fr);position:relative;z-index:1}
  .cow{
    position:relative;aspect-ratio:1;
    display:grid;place-items:center;
    background:none;border:0;padding:0;margin:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    border-radius:14px;
  }
  .cow-in{width:88%;display:block;transition:transform .18s ease}
  .cow svg{width:100%;height:auto;display:block}
  .cow:focus-visible{outline:3px solid var(--surface);outline-offset:2px}
  .cow:active .cow-in{transform:scale(.9)}
  .cow.dim{opacity:.25;filter:saturate(.35);pointer-events:none}
  .cow.wrong{animation:goyang .4s}
  @keyframes goyang{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-5deg)}50%{transform:translateX(6px) rotate(5deg)}80%{transform:translateX(-3px)}}
  .cow.found .cow-in{transform:scale(1.25)}
  .cow.faded{opacity:.22;transition:opacity .4s}

  .cow.peek{overflow:hidden}
  .cow.peek .cow-in{transform:translateY(32%);transition:transform .38s ease}
  .cow.peek.up .cow-in{transform:translateY(-14%)}
  .cow.peek.found .cow-in{transform:translateY(-14%) scale(1.08)}
  .tuft{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;z-index:2}
  .tuft svg{width:100%;height:100%;display:block}

  .row{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:2px;padding:8px 0 2px}
  .row > span{width:19%}
  .row svg{width:100%;height:auto;display:block}
  #hearts{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .final{
    position:relative;z-index:1;margin:10px 6px 2px;text-align:center;
    font-size:25px;font-weight:800;line-height:1.15;color:#FFFFFF;
    text-wrap:balance;text-shadow:0 2px 10px rgba(31,45,24,.55);
  }
  .signature{
    position:relative;z-index:1;margin:8px 10px 4px;text-align:center;
    font-size:14px;color:#F4F8EE;text-shadow:0 1px 6px rgba(31,45,24,.6);
  }

  .panel{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-card);padding:16px;box-shadow:var(--lift);
  }
  h2{margin:0 0 6px;font-size:20px;font-weight:600;line-height:1.2;text-wrap:balance}
  .panel p{margin:0;color:var(--ink-soft);font-size:16px;max-width:36ch}
  .feedback{margin-top:10px !important;min-height:1.55em;font-weight:700;color:var(--ink) !important}
  .feedback.ok{color:var(--pasture-deep) !important}
  .feedback.no{color:var(--accent) !important}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .actions:empty{margin-top:0}
  button.act{
    font-family:inherit;font-size:16px;font-weight:700;
    min-height:48px;padding:0 22px;border-radius:var(--r-btn);
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    cursor:pointer;flex:1 1 auto;
  }
  button.act.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button.act:disabled{opacity:.45;cursor:default}
  button.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
<!--WRAP-->
</head>
<body>
<!--/WRAP-->

<main class="app">
  <header class="bar">
    <h1>Cari Sapi Gemesnya</h1>
    <span class="step" id="step">Belum mulai</span>
  </header>

  <section class="pen" id="slots" aria-label="Sapi yang sudah ketemu"></section>

  <section class="wanted" id="wanted" hidden>
    <div class="wanted-cow" id="wantedCow"></div>
    <div class="wanted-text">
      <p class="wanted-label">Yang dicari</p>
      <ul class="traits" id="traits"></ul>
    </div>
  </section>

  <section class="field" id="field"></section>

  <section class="panel">
    <h2 id="title">Ada sapi gemes yang kabur</h2>
    <p id="text">Lima ronde, tiap ronde satu sapi harus ketemu. Nggak ada kalah di sini &mdash; salah tinggal cari lagi.</p>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <div class="actions" id="actions"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  var field    = document.getElementById('field');
  var titleEl  = document.getElementById('title');
  var textEl   = document.getElementById('text');
  var fbEl     = document.getElementById('feedback');
  var actEl    = document.getElementById('actions');
  var slotsEl  = document.getElementById('slots');
  var stepEl   = document.getElementById('step');
  var wantedEl = document.getElementById('wanted');
  var wCowEl   = document.getElementById('wantedCow');
  var traitsEl = document.getElementById('traits');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- bahan sapi ---------- */

  var BADAN = [
    {id:'putih',  nama:'putih',   c:'#FBF7F0', e:'#D8CDBC'},
    {id:'krem',   nama:'krem',    c:'#F1DFC0', e:'#CDB58F'},
    {id:'coklat', nama:'coklat',  c:'#C4855C', e:'#94603D'},
    {id:'abu',    nama:'abu-abu', c:'#D7D3D9', e:'#A8A2AD'}
  ];
  var BERCAK = [
    {id:'hati',    nama:'bercak hati'},
    {id:'bulat',   nama:'bercak bulat'},
    {id:'bintang', nama:'bercak bintang'},
    {id:'polos',   nama:'tanpa bercak'}
  ];
  var TINTA = [
    {id:'hitam',  nama:'hitam',  c:'#3B333A'},
    {id:'coklat', nama:'coklat', c:'#8A5A3C'},
    {id:'pink',   nama:'pink',   c:'#E48CA0'}
  ];
  var AKSESORI = [
    {id:'pita',    nama:'pita'},
    {id:'bunga',   nama:'bunga di telinga'},
    {id:'lonceng', nama:'lonceng'},
    {id:'kosong',  nama:'polosan'}
  ];
  var WARNA_AKS = [
    {id:'ungu',   nama:'ungu',   c:'#8E6FD1'},
    {id:'kuning', nama:'kuning', c:'#F4B942'},
    {id:'biru',   nama:'biru',   c:'#5B9BD5'},
    {id:'merah',  nama:'merah',  c:'#E05A5A'}
  ];
  var WAJAH = ['senyum','kedip','ngantuk','kaget'];
  var WAJAH_NAMA = {senyum:'lagi senyum', kedip:'lagi kedip', ngantuk:'lagi ngantuk', kaget:'lagi kaget'};

  function acak(a){ return a[Math.floor(Math.random()*a.length)]; }
  function kocok(a){
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function buatSapi(kunci){
    kunci = kunci || {};
    return {
      badan:  kunci.badan  || acak(BADAN),
      bercak: kunci.bercak || acak(BERCAK),
      tinta:  kunci.tinta  || acak(TINTA),
      aks:    kunci.aks    || acak(AKSESORI),
      warna:  kunci.warna  || acak(WARNA_AKS),
      wajah:  kunci.wajah  || (kunci.wajahPool ? acak(kunci.wajahPool) : acak(WAJAH))
    };
  }

  /* tanda tangan satu ciri, dipakai buat mencocokkan */
  function ciri(s, k){
    if (k === 'badan')  return s.badan.id;
    if (k === 'bercak') return s.bercak.id;
    if (k === 'wajah')  return s.wajah;
    if (k === 'aks')    return s.aks.id + ((s.aks.id === 'pita' || s.aks.id === 'bunga') ? ':' + s.warna.id : '');
    return '';
  }
  function samaSemua(a, b, kunci){
    for (var i=0;i<kunci.length;i++){ if (ciri(a,kunci[i]) !== ciri(b,kunci[i])) return false; }
    return true;
  }
  function labelCiri(s, k){
    if (k === 'badan')  return 'badan ' + s.badan.nama;
    if (k === 'bercak') return s.bercak.nama;
    if (k === 'wajah')  return WAJAH_NAMA[s.wajah];
    if (s.aks.id === 'pita')  return 'pita ' + s.warna.nama;
    if (s.aks.id === 'bunga') return 'bunga ' + s.warna.nama + ' di telinga';
    if (s.aks.id === 'lonceng') return 'pakai lonceng';
    return 'nggak pakai apa-apa';
  }
  function deskripsi(s){
    return 'Sapi ' + s.badan.nama + ', ' + s.bercak.nama + ', ' + labelCiri(s,'aks') + ', ' + WAJAH_NAMA[s.wajah] + '.';
  }

  /* ---------- gambar sapi ---------- */

  function bercakSVG(kind, cx, cy, s, warna){
    if (kind === 'bulat'){
      return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(s*1.05)+'" ry="'+(s*0.88)+'" fill="'+warna+'"/>';
    }
    if (kind === 'hati'){
      return '<path d="M'+cx+' '+(cy+s*0.55)
        + ' C'+(cx-s*1.25)+' '+(cy-s*0.35)+' '+(cx-s*0.5)+' '+(cy-s*1.15)+' '+cx+' '+(cy-s*0.32)
        + ' C'+(cx+s*0.5)+' '+(cy-s*1.15)+' '+(cx+s*1.25)+' '+(cy-s*0.35)+' '+cx+' '+(cy+s*0.55)
        + ' Z" fill="'+warna+'"/>';
    }
    if (kind === 'bintang'){
      var p = [];
      for (var i=0;i<10;i++){
        var r = (i % 2 === 0) ? s*1.2 : s*0.52;
        var a = (Math.PI/5)*i - Math.PI/2;
        p.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
      }
      return '<polygon points="'+p.join(' ')+'" fill="'+warna+'"/>';
    }
    return '';
  }

  function mataSVG(wajah, ink){
    var ki = 37, ka = 63, y = 49;
    if (wajah === 'kedip'){
      return '<circle cx="'+ki+'" cy="'+y+'" r="4.2" fill="'+ink+'"/>'
           + '<circle cx="'+(ki+1.4)+'" cy="'+(y-1.5)+'" r="1.5" fill="#FFFFFF"/>'
           + '<path d="M'+(ka-5)+' '+(y+1)+' q5 -6 10 0" fill="none" stroke="'+ink+'" stroke-width="3.4" stroke-linecap="round"/>';
    }
    if (wajah === 'ngantuk'){
      return '<path d="M'+(ki-5)+' '+(y-1)+' q5 6 10 0" fill="none" stroke="'+ink+'" stroke-width="3.4" stroke-linecap="round"/>'
           + '<path d="M'+(ka-5)+' '+(y-1)+' q5 6 10 0" fill="none" stroke="'+ink+'" stroke-width="3.4" stroke-linecap="round"/>';
    }
    if (wajah === 'kaget'){
      return '<circle cx="'+ki+'" cy="'+y+'" r="6" fill="#FFFFFF" stroke="'+ink+'" stroke-width="2"/>'
           + '<circle cx="'+ki+'" cy="'+y+'" r="3" fill="'+ink+'"/>'
           + '<circle cx="'+ka+'" cy="'+y+'" r="6" fill="#FFFFFF" stroke="'+ink+'" stroke-width="2"/>'
           + '<circle cx="'+ka+'" cy="'+y+'" r="3" fill="'+ink+'"/>';
    }
    return '<circle cx="'+ki+'" cy="'+y+'" r="4.2" fill="'+ink+'"/>'
         + '<circle cx="'+(ki+1.4)+'" cy="'+(y-1.5)+'" r="1.5" fill="#FFFFFF"/>'
         + '<circle cx="'+ka+'" cy="'+y+'" r="4.2" fill="'+ink+'"/>'
         + '<circle cx="'+(ka+1.4)+'" cy="'+(y-1.5)+'" r="1.5" fill="#FFFFFF"/>';
  }

  function aksesoriSVG(s){
    var garis = 'rgba(47,42,46,.32)';
    if (s.aks.id === 'pita'){
      return '<g transform="translate(79,26) rotate(10)">'
        + '<path d="M0 0 L-15 -7 L-15 7 Z" fill="'+s.warna.c+'" stroke="'+garis+'" stroke-width="2" stroke-linejoin="round"/>'
        + '<path d="M0 0 L15 -7 L15 7 Z" fill="'+s.warna.c+'" stroke="'+garis+'" stroke-width="2" stroke-linejoin="round"/>'
        + '<circle cx="0" cy="0" r="4.5" fill="'+s.warna.c+'" stroke="'+garis+'" stroke-width="2"/>'
        + '</g>';
    }
    if (s.aks.id === 'bunga'){
      var f = '<g transform="translate(19,25)">';
      for (var i=0;i<5;i++){
        f += '<ellipse cx="0" cy="-6" rx="4" ry="6.5" transform="rotate('+(72*i)+' 0 0)" fill="'+s.warna.c+'" stroke="'+garis+'" stroke-width="1.6"/>';
      }
      return f + '<circle cx="0" cy="0" r="3.4" fill="#F6E7BE"/></g>';
    }
    if (s.aks.id === 'lonceng'){
      return '<path d="M20 80 q30 17 60 0" fill="none" stroke="#8A5A3C" stroke-width="4.5" stroke-linecap="round"/>'
        + '<path d="M50 87 c-6.5 0 -7.5 5 -8.5 8.5 h17 c-1 -3.5 -2 -8.5 -8.5 -8.5 Z" fill="#F4B942" stroke="#C08D22" stroke-width="2.2" stroke-linejoin="round"/>'
        + '<circle cx="50" cy="97.5" r="2" fill="#C08D22"/>';
    }
    return '';
  }

  function sapiSVG(s, opts){
    opts = opts || {};
    var b = s.badan, ink = '#2F2A2E';
    var out = '<svg viewBox="0 0 100 100" '
      + (opts.label ? 'role="img" aria-label="' + opts.label + '"' : 'aria-hidden="true"') + '>';

    out += '<ellipse cx="15" cy="45" rx="13" ry="8.5" transform="rotate(-18 15 45)" fill="'+b.c+'" stroke="'+b.e+'" stroke-width="3"/>'
         + '<ellipse cx="16" cy="45" rx="6" ry="3.6" transform="rotate(-18 16 45)" fill="#E9A5B2"/>'
         + '<ellipse cx="85" cy="45" rx="13" ry="8.5" transform="rotate(18 85 45)" fill="'+b.c+'" stroke="'+b.e+'" stroke-width="3"/>'
         + '<ellipse cx="84" cy="45" rx="6" ry="3.6" transform="rotate(18 84 45)" fill="#E9A5B2"/>';

    out += '<path d="M34 28 c-6 -6 -3 -13 4 -12 c-1 4 -1 8 1 11 Z" fill="#F3E3C6" stroke="'+b.e+'" stroke-width="2.4" stroke-linejoin="round"/>'
         + '<path d="M66 28 c6 -6 3 -13 -4 -12 c1 4 1 8 -1 11 Z" fill="#F3E3C6" stroke="'+b.e+'" stroke-width="2.4" stroke-linejoin="round"/>';

    out += '<ellipse cx="50" cy="55" rx="33" ry="29" fill="'+b.c+'" stroke="'+b.e+'" stroke-width="3"/>';
    out += bercakSVG(s.bercak.id, 29, 40, 11, s.tinta.c);
    out += '<path d="M45 29 q5 -8 10 -1" fill="none" stroke="'+b.e+'" stroke-width="3" stroke-linecap="round"/>';
    out += mataSVG(s.wajah, ink);

    out += '<ellipse cx="50" cy="70" rx="20" ry="13.5" fill="#F2BCC5" stroke="'+b.e+'" stroke-width="2.6"/>'
         + '<ellipse cx="43" cy="67" rx="2.8" ry="3.8" fill="#C9838F"/>'
         + '<ellipse cx="57" cy="67" rx="2.8" ry="3.8" fill="#C9838F"/>'
         + '<path d="M44 76 q6 4.5 12 0" fill="none" stroke="#C9838F" stroke-width="2.6" stroke-linecap="round"/>';

    out += aksesoriSVG(s);
    return out + '</svg>';
  }

  function rumputSVG(){
    return '<svg viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true">'
      + '<path d="M0 50 L0 30 Q8 12 12 32 Q18 6 24 30 Q30 14 36 33 Q44 8 50 30'
      + ' Q57 12 63 32 Q70 10 76 31 Q84 14 90 33 Q96 18 100 30 L100 50 Z" fill="#4F6F41"/>'
      + '<path d="M0 50 L0 38 Q10 24 18 39 Q28 22 38 38 Q48 24 58 39 Q68 23 78 38 Q88 26 100 37 L100 50 Z" fill="#3F5B33"/>'
      + '</svg>';
  }

  /* ---------- keadaan permainan ---------- */

  var TOTAL = 5;
  var dapat = [];
  var bersihkan = null;

  var SALAH = [
    'Muu... salah orang.',
    'Bukan yang itu. Cek lagi kartunya.',
    'Dia bukan yang dicari, tapi senang juga dielus.',
    'Deket. Coba lihat ciri satunya lagi.',
    'Sapi itu cuma numpang lewat.'
  ];
  var BENAR = [
    'Ketemu! Dia langsung nempel.',
    'Nah itu dia. Sekali lihat langsung tahu, ya.',
    'Betul. Dia ikut pulang sekarang.',
    'Dapat! Dia bahkan nggak lari.',
    'Itu sapinya. Matanya sampai menyipit senang.'
  ];
  var salahKe = 0, benarKe = 0;

  function resetPanggung(){
    if (typeof bersihkan === 'function'){ bersihkan(); }
    bersihkan = null;
    field.innerHTML = '';
    fbEl.textContent = '';
    fbEl.className = 'feedback';
    actEl.innerHTML = '';
  }
  function bilang(pesan, jenis){
    fbEl.textContent = pesan;
    fbEl.className = 'feedback' + (jenis ? ' ' + jenis : '');
  }
  function tombol(label, utama, onClick){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'act' + (utama ? ' primary' : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }
  function gambarSlot(popIndex){
    slotsEl.innerHTML = '';
    for (var i=0;i<TOTAL;i++){
      var d = document.createElement('div');
      d.className = 'slot' + (dapat[i] ? ' filled' : '') + (i === popIndex ? ' pop' : '');
      if (dapat[i]){ d.innerHTML = sapiSVG(dapat[i]); }
      slotsEl.appendChild(d);
    }
  }
  function tulisLangkah(){
    stepEl.textContent = dapat.length >= TOTAL
      ? 'Kandang penuh'
      : ('Ronde ' + (dapat.length + 1) + ' dari ' + TOTAL);
  }
  function pasangKartu(target, kunci){
    wantedEl.hidden = false;
    wCowEl.innerHTML = sapiSVG(target, {label: deskripsi(target)});
    traitsEl.innerHTML = '';
    for (var i=0;i<kunci.length;i++){
      var li = document.createElement('li');
      li.textContent = labelCiri(target, kunci[i]);
      traitsEl.appendChild(li);
    }
  }

  /* ---------- inti: satu ronde cari sapi ---------- */

  function ronde(cfg, selesai){
    resetPanggung();
    titleEl.textContent = cfg.judul;
    textEl.textContent  = cfg.teks;
    tulisLangkah();

    var target = buatSapi(cfg.kunciTarget || {});
    var kawanan = [target], jaga = 0;
    while (kawanan.length < cfg.jumlah && jaga < 8000){
      jaga++;
      var s = buatSapi(cfg.dasar || {});
      if (!samaSemua(s, target, cfg.ciri)) kawanan.push(s);
    }
    kocok(kawanan);
    pasangKartu(target, cfg.ciri);

    var grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.setProperty('--cols', cfg.kolom);
    field.appendChild(grid);

    var sel = [], timers = [], beres = false;

    function ketuk(el, s){
      if (beres) return;

      if (cfg.ngintip && !el.classList.contains('up')){
        el.classList.add('up');
        timers.push(setTimeout(function(){
          if (!beres) el.classList.remove('up');
        }, 1500));
        if (!samaSemua(s, target, cfg.ciri)){
          bilang('Bukan dia. Coba rumput sebelah.', 'no');
          return;
        }
      }

      if (samaSemua(s, target, cfg.ciri)){
        beres = true;
        el.classList.add('found', 'up');
        sel.forEach(function(o){ if (o.el !== el) o.el.classList.add('faded'); });
        bilang(BENAR[benarKe++ % BENAR.length], 'ok');
        dapat.push(s);
        gambarSlot(dapat.length - 1);
        tulisLangkah();
        actEl.innerHTML = '';
        timers.push(setTimeout(function(){
          actEl.appendChild(tombol(
            dapat.length >= TOTAL ? 'Lihat kandangnya' : 'Ronde berikutnya', true, selesai));
        }, reduced ? 0 : 600));
      } else {
        el.classList.remove('wrong');
        void el.offsetWidth;
        el.classList.add('wrong');
        bilang(SALAH[salahKe++ % SALAH.length], 'no');
      }
    }

    kawanan.forEach(function(s){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cow' + (cfg.ngintip ? ' peek' : '');
      b.setAttribute('aria-label', deskripsi(s));
      var dalam = document.createElement('span');
      dalam.className = 'cow-in';
      dalam.innerHTML = sapiSVG(s);
      b.appendChild(dalam);
      if (cfg.ngintip){
        var t = document.createElement('span');
        t.className = 'tuft';
        t.innerHTML = rumputSVG();
        b.appendChild(t);
      }
      b.addEventListener('click', function(){ ketuk(b, s); });
      grid.appendChild(b);
      sel.push({el:b, dalam:dalam, sapi:s});
    });

    var petunjuk = tombol('Kasih petunjuk', false, function(){
      var k = cfg.ciri[0], dipakai = 0, batas = Math.floor(cfg.jumlah / 2);
      sel.forEach(function(o){
        if (dipakai < batas && ciri(o.sapi, k) !== ciri(target, k)){
          o.el.classList.add('dim');
          dipakai++;
        }
      });
      petunjuk.disabled = true;
      petunjuk.textContent = 'Petunjuk dipakai';
      bilang('Yang jelas nggak cocok sudah saya suruh minggir.', '');
    });
    actEl.appendChild(petunjuk);

    var raf = 0;
    if (cfg.gerak && !reduced){
      var fase = sel.map(function(){
        return {a: Math.random()*Math.PI*2, b: Math.random()*Math.PI*2, s: 0.6 + Math.random()*0.6};
      });
      var mulai = performance.now();
      var jalan = function(t){
        var d = (t - mulai) / 1000;
        for (var i=0;i<sel.length;i++){
          var f = fase[i];
          var x = Math.sin(d * f.s + f.a) * 8;
          var y = Math.cos(d * f.s * 0.8 + f.b) * 6;
          sel[i].dalam.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        }
        raf = requestAnimationFrame(jalan);
      };
      raf = requestAnimationFrame(jalan);
    }

    bersihkan = function(){
      if (raf) cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
    };
  }

  /* ---------- daftar ronde ---------- */

  var RONDE = [
    function(next){
      ronde({
        judul:'Ronde 1 · Kenalan dulu',
        teks:'Cari sapi yang cocok sama kartu di atas. Cuma satu yang benar.',
        jumlah:6, kolom:3, ciri:['bercak']
      }, next);
    },
    function(next){
      ronde({
        judul:'Ronde 2 · Padangnya mulai ramai',
        teks:'Sekarang dua ciri, dan dua-duanya harus cocok.',
        jumlah:12, kolom:4, ciri:['bercak','aks']
      }, next);
    },
    function(next){
      ronde({
        judul:'Ronde 3 · Sapinya jalan-jalan',
        teks:'Mereka nggak mau diam. Sabar, kejar pelan-pelan.',
        jumlah:12, kolom:4, ciri:['badan','aks'], gerak:true
      }, next);
    },
    function(next){
      ronde({
        judul:'Ronde 4 · Bobo di rumput tinggi',
        teks:'Ketuk rumputnya buat ngintip. Sapinya nongol sebentar, terus tidur lagi.',
        jumlah:9, kolom:3, ciri:['bercak','badan'], ngintip:true
      }, next);
    },
    function(next){
      ronde({
        judul:'Ronde 5 · Sapi kembar',
        teks:'Enam belas sapi sama persis. Cuma satu yang lagi kedipin kamu.',
        jumlah:16, kolom:4, ciri:['wajah'],
        dasar:      {badan:BADAN[0], bercak:BERCAK[1], tinta:TINTA[0], aks:AKSESORI[3], warna:WARNA_AKS[0], wajahPool:['senyum']},
        kunciTarget:{badan:BADAN[0], bercak:BERCAK[1], tinta:TINTA[0], aks:AKSESORI[3], warna:WARNA_AKS[0], wajah:'kedip'}
      }, next);
    }
  ];

  /* ---------- penutup ---------- */

  function penutup(){
    resetPanggung();
    wantedEl.hidden = true;
    titleEl.textContent = 'Lima-limanya pulang';
    textEl.textContent = 'Kandangnya penuh. Sapi-sapinya sekarang berjejer nunggu dielus.';
    stepEl.textContent = 'Kandang penuh';

    var canvas = document.createElement('canvas');
    canvas.id = 'hearts';
    field.appendChild(canvas);

    var baris = document.createElement('div');
    baris.className = 'row';
    baris.innerHTML = dapat.map(function(s){ return '<span>' + sapiSVG(s) + '</span>'; }).join('');
    field.appendChild(baris);

    var akhir = document.createElement('p');
    akhir.className = 'final';
    akhir.textContent = 'Tapi yang paling gemes tetap Piyaa';
    field.appendChild(akhir);

    var ttd = document.createElement('p');
    ttd.className = 'signature';
    ttd.textContent = 'Dari Ale. Kalau nanti sedih lagi, panggil aja sapinya.';
    field.appendChild(ttd);

    actEl.appendChild(tombol('Main lagi dari awal', true, function(){
      dapat = [];
      gambarSlot(-1);
      tulisLangkah();
      jalankan();
    }));

    if (reduced) return;

    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0;
    function ukur(){
      W = field.clientWidth; H = field.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    ukur();
    window.addEventListener('resize', ukur);

    var hati = [];
    for (var i=0;i<26;i++){
      hati.push({
        x: Math.random()*W,
        y: Math.random()*H - H,
        s: 5 + Math.random()*7,
        v: 18 + Math.random()*26,
        g: Math.random()*Math.PI*2,
        p: 0.5 + Math.random()*0.9,
        w: ['#FFFFFF','#FBD3DD','#F6E7BE'][Math.floor(Math.random()*3)]
      });
    }
    function gambarHati(x, y, s, rot, warna){
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = warna;
      ctx.beginPath();
      ctx.moveTo(0, s*0.42);
      ctx.bezierCurveTo(-s*1.2, -s*0.35, -s*0.5, -s*1.1, 0, -s*0.32);
      ctx.bezierCurveTo(s*0.5, -s*1.1, s*1.2, -s*0.35, 0, s*0.42);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    var lalu = performance.now(), rafId = 0;
    function bingkai(t){
      var dt = Math.min((t - lalu)/1000, 0.05); lalu = t;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = 0.85;
      for (var i=0;i<hati.length;i++){
        var h = hati[i];
        h.y += h.v * dt;
        h.g += h.p * dt;
        h.x += Math.sin(h.g) * 12 * dt;
        if (h.y - h.s > H){ h.y = -h.s*2; h.x = Math.random()*W; }
        gambarHati(h.x, h.y, h.s, Math.sin(h.g)*0.4, h.w);
      }
      ctx.globalAlpha = 1;
      rafId = requestAnimationFrame(bingkai);
    }
    rafId = requestAnimationFrame(bingkai);
    bersihkan = function(){
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', ukur);
    };
  }

  /* ---------- alur ---------- */

  function jalankan(){
    var i = dapat.length;
    if (i >= TOTAL){ penutup(); return; }
    RONDE[i](function(){ jalankan(); });
  }

  function pembuka(){
    resetPanggung();
    wantedEl.hidden = true;
    gambarSlot(-1);
    stepEl.textContent = 'Belum mulai';

    var sambutan = buatSapi({
      badan:BADAN[0], bercak:BERCAK[0], tinta:TINTA[2],
      aks:AKSESORI[0], warna:WARNA_AKS[0], wajah:'kedip'
    });
    var wadah = document.createElement('div');
    wadah.className = 'row';
    wadah.innerHTML = '<span style="width:44%">' + sapiSVG(sambutan, {label:'Sapi yang menyambut'}) + '</span>';
    field.appendChild(wadah);

    var ttd = document.createElement('p');
    ttd.className = 'signature';
    ttd.textContent = 'Untuk Piyaa. Dari Ale.';
    field.appendChild(ttd);

    actEl.appendChild(tombol('Mulai cari', true, jalankan));
  }

  pembuka();
})();
</script>
